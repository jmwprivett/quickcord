<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; color: #e6e8ec; font: 15px "gg sans", "Segoe UI Variable Text", "Segoe UI", -apple-system, sans-serif; overflow: hidden; user-select: none; }
  /* the window is transparent; #app is the visible panel, with margin left around it for the shadow */
  #app {
    margin: 16px; padding: 12px; border-radius: 16px;
    background: linear-gradient(160deg, rgba(64, 66, 78, .80), rgba(28, 29, 35, .86));
    box-shadow: 0 14px 36px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .10);
    opacity: 0; transform: translateY(-8px) scale(.97);
    transition: opacity .11s ease-in, transform .11s ease-in, border-color .2s, box-shadow .2s;
  }
  #app.shown {
    opacity: 1; transform: none;
    transition: opacity .16s ease-out, transform .22s cubic-bezier(.2, .9, .3, 1.15), border-color .2s, box-shadow .2s;
  }
  /* thin white outline while the box has keyboard focus (a hairline on Retina screens) */
  /* Windows: the window is see-through (no blur); the OS draws round corners and the shadow and fades it */
  html.win #app {
    margin: 0; border: 0; border-radius: 8px;  /* same panel colour as macOS, from #app above */
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    opacity: 1; transform: none; transition: border-color .2s, box-shadow .2s;
  }
  .bar { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; border-radius: 10px; background: rgba(255, 255, 255, .07); color: inherit;
    font: inherit; line-height: 22px; padding: 12px 14px; height: 46px; max-height: 200px; user-select: text;
  }
  textarea::placeholder { color: rgba(230, 232, 236, .45); }
  textarea:disabled { opacity: .6; }
  .to {
    display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 10px 0 8px; max-width: 200px;
    border: 0; border-radius: 10px; background: rgba(255, 255, 255, .07); color: inherit; font: inherit; cursor: pointer; outline: 0;
    transition: background .12s;
  }
  .to:hover, .to:focus-visible, .to.open { background: rgba(255, 255, 255, .13); }
  .to span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .to svg { flex: none; opacity: .7; transition: transform .15s; }
  .to.open svg { transform: rotate(180deg); }
  img { width: 26px; height: 26px; border-radius: 50%; flex: none; background: rgba(0, 0, 0, .25); }
  .err { color: #ff6b6e; font-size: 13px; padding: 8px 2px 0; }
  .menu { margin-top: 8px; background: rgba(0, 0, 0, .22); border-radius: 10px; padding: 6px; animation: drop .14s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
  .menu input {
    width: 100%; border: 0; outline: 0; border-radius: 7px; background: rgba(255, 255, 255, .07); color: inherit; font: inherit;
    padding: 8px 10px; margin-bottom: 4px; user-select: text;
  }
  .menu input::placeholder { color: rgba(230, 232, 236, .45); }
  .list { max-height: 290px; overflow-y: auto; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 4px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; color: rgba(230, 232, 236, .72); }
  .item.active { background: rgba(255, 255, 255, .11); color: #fff; }
  .item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 10px; color: rgba(230, 232, 236, .45); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <textarea id="msg" rows="1" placeholder="Message"></textarea>
    <button class="to" id="to" tabindex="0">
      <img id="toAvatar" alt=""><span id="toName">Loading…</span>
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="err" id="err" hidden></div>
  <div class="menu" id="menu" hidden>
    <input id="filter" placeholder="Find a conversation">
    <div class="list" id="list"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const msg = $("msg"), to = $("to"), menu = $("menu"), filter = $("filter"), list = $("list"), err = $("err");
const app = $("app");
let chats = [], selected = null, active = 0, sending = false, hideTimer = null;

const api = () => window.pywebview.api;
const WIN = document.documentElement.classList.contains("win");
// offsetHeight ignores the open/close scale transform; add the transparent margin on both sides of the panel
const fit = () => api().resize(app.offsetHeight + 2 * parseFloat(getComputedStyle(app).marginTop));

// play the fade-out, then actually hide the window (on Windows, Python fades the whole window instead)
function closeBox() {
  if (hideTimer) return;
  app.classList.remove("shown");
  hideTimer = setTimeout(() => { hideTimer = null; api().hide(); }, WIN ? 0 : 120);
}

function grow() {
  msg.style.height = "46px";
  msg.style.height = Math.min(msg.scrollHeight, 200) + "px";
  fit();
}

function showError(text) {
  err.textContent = text || "";
  err.hidden = !text;
  fit();
}

function pick(chat) {
  selected = chat;
  $("toName").textContent = chat ? chat.name : "No DMs";
  $("toAvatar").src = chat ? chat.avatar : "";
}

function shown() {
  const q = filter.value.trim().toLowerCase();
  return chats.filter(c => c.name.toLowerCase().includes(q));
}

function render() {
  const items = shown();
  active = Math.max(0, Math.min(active, items.length - 1));
  list.innerHTML = items.length ? "" : '<div class="empty">No matches</div>';
  items.forEach((c, i) => {
    // names and avatars come from Discord, so never build HTML strings from them
    const el = document.createElement("div"), img = document.createElement("img"), name = document.createElement("span");
    el.className = "item" + (i === active ? " active" : "");
    img.src = c.avatar;
    name.textContent = c.name;
    el.append(img, name);
    el.onmousedown = e => { e.preventDefault(); choose(c); };
    list.appendChild(el);
  });
  list.querySelector(".active")?.scrollIntoView({ block: "nearest" });
}

function openMenu() {
  menu.hidden = false;
  to.classList.add("open");
  filter.value = "";
  active = Math.max(0, chats.indexOf(selected));
  render();
  fit();
  filter.focus();
}

function closeMenu() {
  menu.hidden = true;
  to.classList.remove("open");
  fit();
  msg.focus();
}

function choose(chat) {
  pick(chat);
  closeMenu();
}

async function send() {
  const text = msg.value.trim();
  if (!text || !selected || sending) return;
  sending = msg.disabled = true;
  const res = await api().send(selected.id, text);
  sending = msg.disabled = false;
  if (res.error) {
    showError(res.error);  // keep the text so nothing is lost
    msg.focus();
    return;
  }
  msg.value = "";
  grow();
  closeBox();
}

msg.addEventListener("input", grow);
msg.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  else if (e.key === "Tab") { e.preventDefault(); openMenu(); }
});
to.addEventListener("click", () => menu.hidden ? openMenu() : closeMenu());
filter.addEventListener("input", () => { active = 0; render(); });
filter.addEventListener("keydown", e => {
  const n = shown().length;
  if (e.key === "ArrowDown") { e.preventDefault(); active = (active + 1) % n; render(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); active = (active - 1 + n) % n; render(); }
  else if (e.key === "Enter") { e.preventDefault(); if (n) choose(shown()[active]); }
  else if (e.key === "Escape" || e.key === "Tab") { e.preventDefault(); e.stopPropagation(); closeMenu(); }
});
// Esc anywhere in the box closes it (the dropdown's filter handles its own Esc first)
document.addEventListener("keydown", e => { if (e.key === "Escape") closeBox(); });
// bringing the window forward can blur it for a moment, so only close if focus is really gone
window.addEventListener("blur", () => {
  setTimeout(() => { if (!document.hasFocus() && !sending) closeBox(); }, 150);
});

// called from Python every time the box opens; notice is an optional message to show (e.g. missing permissions)
async function onShow(notice) {
  clearTimeout(hideTimer);  // reopened mid fade-out: don't let the old timer hide the new box
  hideTimer = null;
  app.classList.remove("shown");
  void app.offsetWidth;  // restart the pop-in from its starting pose
  app.classList.add("shown");
  if (!menu.hidden) closeMenu();
  showError(notice);
  msg.focus();
  const res = await api().chats();
  if (res.error) return showError(notice || res.error);
  chats = res.chats;
  pick(chats[0] || null);  // most recent conversation
}
</script>
</body>
</html>
